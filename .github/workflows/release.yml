name: Desktop release

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
    paths: ["native/**", "browser/**", "tsconfig*.json", "electron/**", "windows-preview/**", "public/**", "preview.html", "src/**", "shared/**", "scripts/**", "tests/**", "design/icon.svg", "package*.json", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, for example v0.5.2"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/codex/') }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install desktop runtime libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 xdg-utils desktop-file-utils libglib2.0-bin dbus-x11 kde-cli-tools fonts-noto-cjk pandoc libreoffice-writer libfuse2
      - name: Prepare real FUSE device
        run: sudo modprobe fuse && test -c /dev/fuse
      - name: Prepare actual PDF content validation
        run: |
          python3 -m venv "$RUNNER_TEMP/open-typora-pdf"
          "$RUNNER_TEMP/open-typora-pdf/bin/python" -m pip install --disable-pip-version-check pypdf==6.1.1
          echo "OPEN_TYPORA_PDF_PYTHON=$RUNNER_TEMP/open-typora-pdf/bin/python" >> "$GITHUB_ENV"
      - run: npm test
        env:
          OPEN_TYPORA_REQUIRE_CONVERTERS: "1"
      - name: Build Linux x64 DEB and AppImage
        run: npm run package:linux
      - name: Install DEB, exercise both packaged payloads, and uninstall
        run: xvfb-run -a node tests/linux-install.mts
        env:
          OPEN_TYPORA_QA_DIR: ${{ runner.temp }}/open-typora-linux-qa
      - name: Save Linux acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-acceptance
          path: ${{ runner.temp }}/open-typora-linux-qa
          retention-days: 7
      - name: Save tested Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages
          path: |
            release/linux/*.deb
            release/linux/*.AppImage
            release/linux/SHA256SUMS-linux-x64.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install conversion tools for actual DOC, RTF and media acceptance
        shell: pwsh
        run: |
          # Pinned upstream installers avoid the Chocolatey feed dependency.
          # Checksums: jgm/pandoc release 3.12.1 and the LibreOffice mirror list.
          $packages = @(
            @{ Name = 'pandoc'; Url = 'https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-windows-x86_64.msi'; Sha256 = 'b6bf9f2c8408a1689272be5722e45f93ed9da17ba74321d0f7ef4e5a196605e8' },
            @{ Name = 'libreoffice'; Url = 'https://download.documentfoundation.org/libreoffice/stable/26.8.1/win/x86_64/LibreOffice_26.8.1_Win_x86-64.msi'; Sha256 = 'c6298b10cfa1748bcbedad94c62ce771e240e5021bfd6d7a967cd571b04b5312' }
          )
          foreach ($package in $packages) {
            $installer = Join-Path $env:RUNNER_TEMP ($package.Name + '.msi')
            curl.exe --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 $package.Url --output $installer
            if ($LASTEXITCODE -ne 0) { throw ($package.Name + ' download failed') }
            if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $package.Sha256) { throw ($package.Name + ' checksum mismatch') }
            $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart', 'ALLUSERS=1') -Wait -PassThru
            if ($install.ExitCode -ne 0 -and $install.ExitCode -ne 3010) { throw ($package.Name + ' install failed: ' + $install.ExitCode) }
          }
          node --input-type=module -e "import {pandocPath,libreOfficePath} from './build/runtime/electron/interchange.mjs'; if (!(await pandocPath()) || !(await libreOfficePath())) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Installed conversion tools were not found' }
          exit 0
      - name: Prepare actual PDF content validation
        shell: pwsh
        run: |
          $pdfEnvironment = Join-Path $env:RUNNER_TEMP 'open-typora-pdf'
          python -m venv $pdfEnvironment
          $pdfPython = Join-Path $pdfEnvironment 'Scripts/python.exe'
          & $pdfPython -m pip install --disable-pip-version-check pypdf==6.1.1
          "OPEN_TYPORA_PDF_PYTHON=$pdfPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm test
        env:
          OPEN_TYPORA_REQUIRE_CONVERTERS: "1"
      - name: Build Windows x64 installer and ZIP
        run: npm run package:win
      - name: Install, exercise the installed app, and uninstall
        shell: pwsh
        run: ./tests/windows-install.ps1
      - name: Save Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-acceptance
          path: ${{ runner.temp }}/open-typora-windows-qa
          retention-days: 7
      - name: Save tested Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-packages
          path: |
            release/windows/*-Setup.exe
            release/windows/*.zip
            release/windows/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          retention-days: 7

  windows-preview:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/large-documents.test.mts
      - run: npm run build
      - name: Compile and exercise the native preview component in Everything
        shell: pwsh
        run: |
          ./scripts/build-windows-preview.ps1
          ./tests/windows-preview.ps1
        env:
          OPEN_TYPORA_PREVIEW_COMPONENT: ${{ github.workspace }}/build/windows-preview
          OPEN_TYPORA_QA_DIR: ${{ runner.temp }}/open-typora-preview-qa
      - name: Save native component acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-preview-acceptance
          path: ${{ runner.temp }}/open-typora-preview-qa
          retention-days: 7

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Apple Silicon runner
        run: node -e "if(process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:native
      - name: Build native app, DMG, ZIP, and checksums
        run: npm run package:release
      - name: Verify real native spreadsheet clipboard, source mode and undo
        run: node scripts/test-webkit.mts --clipboard
      - run: mv release/native/SHA256SUMS.txt release/native/SHA256SUMS-macos-arm64.txt
      - name: Save tested macOS packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-packages
          path: |
            release/native/*.dmg
            release/native/*.zip
            release/native/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error
          retention-days: 7

  linux-fuse:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare Ubuntu 24 FUSE and desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 dbus-x11 fonts-noto-cjk libfuse2t64 apparmor
          sudo modprobe fuse
          test -c /dev/fuse
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-packages
          path: release/linux
      - name: Verify the same AppImage and scope its namespace permission
        run: |
          cd release/linux
          sha256sum --check SHA256SUMS-linux-x64.txt
          cd ../..
          python3 - <<'PYPROFILE'
          import os,pathlib,json
          root=pathlib.Path(os.environ['RUNNER_TEMP']);version=json.loads(pathlib.Path('package.json').read_text())['version'];image=pathlib.Path('release/linux',f'Open-Typora-{version}-linux-x64.AppImage').resolve();image.chmod(0o755)
          (root/'open-typora-appimage.apparmor').write_text('abi <abi/4.0>,\ninclude <tunables/global>\nprofile open-typora-appimage-ci "'+str(image)+'" flags=(unconfined) {\n  userns,\n}\n')
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('OPEN_TYPORA_APPIMAGE='+str(image)+'\n')
          PYPROFILE
          sudo apparmor_parser -r "$RUNNER_TEMP/open-typora-appimage.apparmor"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Exercise actual FUSE runtime and sandboxed editing
        run: xvfb-run -a node tests/linux-appimage-fuse.mts "$OPEN_TYPORA_APPIMAGE"
        env:
          OPEN_TYPORA_QA_DIR: ${{ runner.temp }}/open-typora-real-fuse-qa
          OPEN_TYPORA_FUSE_APPARMOR: app-specific profile for verified AppImage; global restriction remains enabled
      - name: Remove temporary application profile
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/open-typora-appimage.apparmor" ]; then sudo apparmor_parser -R "$RUNNER_TEMP/open-typora-appimage.apparmor"; fi
      - name: Save real FUSE acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-fuse-ubuntu-24.04
          path: ${{ runner.temp }}/open-typora-real-fuse-qa
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    needs: [macos, windows, linux, linux-fuse, windows-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-packages'
          merge-multiple: true
          path: release-assets
      - name: Verify version and every release checksum
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          cd release-assets
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish all three platforms together
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft.txt"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft.txt")" != "true" ]; then
              echo 'This release is already published; refusing to replace its assets.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Open Typora ${RELEASE_TAG#v}" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.dmg release-assets/*-Setup.exe release-assets/*.zip release-assets/*.deb release-assets/*.AppImage release-assets/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
