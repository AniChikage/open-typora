name: Complete verified 0.24.1 release

# One-off recovery for a release whose hosted macOS runner was unavailable.
# The application source, CI artifacts and Mac checksums are frozen below.
on: workflow_dispatch
permissions:
  actions: read
  contents: write
concurrency:
  group: complete-verified-0.24.1
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: AniChikage/open-markdown-lane
      RELEASE_TAG: v0.24.1
      DRAFT_TAG: untagged-ffbe7a1a527fd02af6dc
      SOURCE_SHA: 3c536b5d69ff03906f5c1aafc17cca00871850a7
    steps:
      - name: Verify frozen source, artifacts and private draft
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$GH_REPO"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/41859795834" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/actions/artifacts/13340806230" --jq .digest)" = "sha256:6dcfb5a460d28cc2753d96067938d020594e1fe28685b592bdbd2ccdedc8dcaf"
          test "$(gh api "repos/$GH_REPO/actions/artifacts/13341020985" --jq .digest)" = "sha256:213fef7a1a58e7b460014677a67551676f77ff5d0d5f380b29ac7acd12c07fb0"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name=="untagged-ffbe7a1a527fd02af6dc")' > "$RUNNER_TEMP/draft.json"
          jq -e '.draft == true and .name == "Open Markdown Lane 0.24.1"' "$RUNNER_TEMP/draft.json"
          echo "RELEASE_ID=$(jq -r .id "$RUNNER_TEMP/draft.json")" >> "$GITHUB_ENV"
      - name: Download already tested Windows and Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 13340806230,13341020985
          run-id: 41859795834
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-assets
      - name: Download the locally tested Mac packages from the private draft
        shell: bash
        run: |
          set -euo pipefail
          for name in Open-Markdown-Lane-0.24.1-arm64.dmg Open-Markdown-Lane-0.24.1-arm64.zip; do
            id=$(jq -r --arg name "$name" '.assets[] | select(.name==$name and .state=="uploaded") | .id' "$RUNNER_TEMP/draft.json")
            test -n "$id"
            gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$id" > "release-assets/$name"
          done
      - name: Verify every package before publication
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          cat > SHA256SUMS.txt <<'SUMS'
          42bce04593ba26c46ee8b7c2afd222cc22c6cd4172b475710151a92690465711  Open-Markdown-Lane-0.24.1-arm64.dmg
          03e5bb7e326d0f1e5b6c34c9f7ae0794a1a02acdc5ac31c2b49e43d37be31c03  Open-Markdown-Lane-0.24.1-arm64.zip
          aea136499c63b0fe439d8dde4a3a9e306411ffaab0094d00598bf003b2a5b142  Open-Markdown-Lane-0.24.1-linux-x64.AppImage
          072b7792f18ee2ddfa17498b0d295511569ca54766c4da32f02dd849e6be38d7  Open-Markdown-Lane-0.24.1-linux-x64.deb
          1ef42787a472417cd22fbc85ecef40c33741861e447be4c38e5ee2f32cd92da3  Open-Markdown-Lane-0.24.1-windows-x64-Setup.exe
          6191df791fbdc4e73849bea271eb7ad9ca01e09ca1797b6e8e15fe6996179e2a  Open-Markdown-Lane-0.24.1-windows-x64.zip
          SUMS
          sha256sum --check SHA256SUMS.txt
      - name: Complete the draft and publish all platforms together
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .draft)" = true
          gh release upload "$DRAFT_TAG" release-assets/*-Setup.exe release-assets/*-windows-x64.zip release-assets/*.deb release-assets/*.AppImage release-assets/SHA256SUMS.txt --clobber
          gh release edit "$DRAFT_TAG" --tag "$RELEASE_TAG" --verify-tag --draft=false --latest
      - name: Verify the seven public attachments
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/published.json"
          jq -e '.draft == false and (.assets | length) == 7 and all(.assets[]; .state=="uploaded")' "$RUNNER_TEMP/published.json"
          mkdir public-check
          cd public-check
          curl --fail --location --retry 2 -o SHA256SUMS.txt "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/SHA256SUMS.txt"
          cmp SHA256SUMS.txt ../release-assets/SHA256SUMS.txt
          while read -r digest name; do
            curl --fail --location --retry 2 -o "$name" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$name"
          done < SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
