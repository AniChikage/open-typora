name: Real AppImage FUSE acceptance
on:
  push:
    branches: [main, "codex/**"]
    paths: ["tests/linux-appimage-fuse.mjs", ".github/workflows/linux-fuse.yml"]
permissions:
  contents: read
jobs:
  fuse:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            packages: libgtk-3-0 libasound2 libfuse2
          - os: ubuntu-24.04
            packages: libgtk-3-0t64 libasound2t64 libfuse2t64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare FUSE and desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libxss1 libxtst6 dbus-x11 fonts-noto-cjk ${{ matrix.packages }}
          sudo modprobe fuse
          test -c /dev/fuse
          id
      - name: Download the pinned current public AppImage
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 240 https://github.com/AniChikage/open-typora/releases/download/v0.17.2/Open-Typora-0.17.2-linux-x64.AppImage --output "$RUNNER_TEMP/Open-Typora-0.17.2-linux-x64.AppImage"
          echo 'cb010a028a5954f360eec40ac5af5b834bc5ad1d381ed6a2a8a17d5976a8e930  '"$RUNNER_TEMP/Open-Typora-0.17.2-linux-x64.AppImage" | sha256sum --check
          chmod u+x "$RUNNER_TEMP/Open-Typora-0.17.2-linux-x64.AppImage"
      - name: Scope Ubuntu 24 user namespaces to the verified AppImage
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 - <<'PYPROFILE'
          import os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);image=root/'Open-Typora-0.17.2-linux-x64.AppImage'
          (root/'open-typora-appimage.apparmor').write_text('abi <abi/4.0>,\ninclude <tunables/global>\nprofile open-typora-appimage-test "'+str(image)+'" flags=(unconfined) {\n  userns,\n}\n')
          PYPROFILE
          sudo apparmor_parser -r "$RUNNER_TEMP/open-typora-appimage.apparmor"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          echo "OPEN_TYPORA_FUSE_APPARMOR=app-specific profile for verified AppImage; global restriction remains enabled" >> "$GITHUB_ENV"
      - name: Exercise real FUSE mount, sandbox, editing and unmount
        run: xvfb-run -a node tests/linux-appimage-fuse.mjs "$RUNNER_TEMP/Open-Typora-0.17.2-linux-x64.AppImage"
        env:
          OPEN_TYPORA_QA_DIR: ${{ runner.temp }}/open-typora-real-fuse-qa
      - name: Remove temporary application profile
        if: always() && matrix.os == 'ubuntu-24.04'
        run: |
          if [ -f "$RUNNER_TEMP/open-typora-appimage.apparmor" ]; then sudo apparmor_parser -R "$RUNNER_TEMP/open-typora-appimage.apparmor"; fi
      - name: Save FUSE acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: real-fuse-${{ matrix.os }}
          path: ${{ runner.temp }}/open-typora-real-fuse-qa
          retention-days: 7
