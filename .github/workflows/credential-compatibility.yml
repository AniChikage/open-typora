name: Linux credential compatibility

on:
  push:
    branches: [main, "codex/**"]
    paths: ["electron/**", "shared/branding.mts", "tests/branding-secrets.mts", "package*.json", ".github/workflows/credential-compatibility.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credentials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libsecret:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare isolated Secret Service runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 dbus-x11 libglib2.0-bin gnome-keyring libsecret-tools
      - run: npm run build
      - name: Read an old encrypted credential with the renamed application
        run: xvfb-run -a dbus-run-session -- node tests/branding-secrets.mts
